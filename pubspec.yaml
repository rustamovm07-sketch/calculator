name: adenalin_calculator
description: Offline horse processing and qazi composition calculator.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/adenalin_icon.png

flutter_launcher_icons:
  android: true
  image_path: assets/images/adenalin_icon.png
  adaptive_icon_background: '#111113'
  adaptive_icon_foreground: assets/images/adenalin_icon.png
